<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>짧글모 — 짧은 글 모음</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
:root{--paper:#f7f4ed;--white:#fffefa;--ink:#2b2b2b;--muted:#85857b;--line:#e6e1d6;--green:#2e3a2f;--olive:#7a8a73;--gold:#b89b7a;--serif:'Noto Serif KR',Georgia,serif;--sans:'DM Sans','Apple SD Gothic Neo',sans-serif;--shadow:0 14px 40px rgba(41,39,29,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,58px);background:#fffefaed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:160px}.brand-mark{width:43px;height:43px;object-fit:cover;border-radius:12px;box-shadow:0 2px 8px #29271d1a}.brand-name{font:500 21px var(--serif);letter-spacing:.12em}.brand-sub{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:-4px}
.nav{display:flex;align-items:center;gap:clamp(10px,1.8vw,25px)}.nav button{border:0;background:none;color:#77776e;padding:9px 0;font-size:12px;white-space:nowrap}.nav button.active{color:var(--green);font-weight:700;border-bottom:2px solid var(--green)}
.top-actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);padding:10px 14px;border-radius:3px;font-size:12px;transition:.18s}.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.soft{background:#edf0e8;border-color:#dce2d5;color:var(--green)}.iconbtn{border:1px solid var(--line);background:var(--white);width:37px;height:37px;border-radius:50%;font-size:16px}.mobile-menu{display:none}
.main{max-width:1240px;margin:auto;padding:35px clamp(16px,4vw,52px) 75px;min-height:76vh}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--olive);font-weight:700}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center;padding:34px 0 55px}.hero h1{font:500 clamp(34px,4.5vw,56px)/1.4 var(--serif);letter-spacing:-.06em;margin:14px 0}.hero h1 em{font-style:normal;color:var(--olive)}.hero p{max-width:520px;color:#77776e;line-height:2;margin-bottom:25px}.hero-art{height:340px;border:1px solid var(--line);background:#eee9de;border-radius:4px;display:grid;place-items:center;overflow:hidden}.hero-art img{width:100%;height:100%;object-fit:contain}
.hero-actions,.row-actions{display:flex;gap:9px;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:20px 0 16px}.section-head h2,.page-title h1{font:500 27px var(--serif);margin:4px 0}.section-head p,.page-title p{margin:0;color:var(--muted);font-size:12px}.page-title{padding:18px 0 25px;border-bottom:1px solid var(--line);margin-bottom:24px}.page-title h1{font-size:37px}.page-title .btn{margin-top:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid.two{grid-template-columns:repeat(2,1fr)}.card,.panel{background:var(--white);border:1px solid var(--line);padding:20px;min-width:0}.card{transition:.2s}.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.card h3{font:500 19px/1.55 var(--serif);margin:10px 0 6px}.card p{font-size:12px;color:#77776e;line-height:1.9;margin:0 0 13px}.tag{font-size:10px;padding:4px 8px;background:#f0eee7;color:#737366;border-radius:2px;display:inline-block;margin:2px}.tag.green{background:#e9eee5;color:var(--green)}.meta{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px;margin-top:12px;display:flex;justify-content:space-between;gap:8px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{min-width:220px;max-width:340px;flex:1;position:relative}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fffefa;padding:11px 12px;color:var(--ink);outline:none;border-radius:2px}.input:focus,.select:focus,.textarea:focus{border-color:var(--olive)}.textarea{min-height:120px;resize:vertical;line-height:1.9}.chips,.options{display:flex;gap:7px;flex-wrap:wrap}.chip,.option{border:1px solid var(--line);background:var(--white);padding:7px 11px;color:#74746b;font-size:11px;border-radius:2px}.chip.active,.option.selected{background:var(--green);border-color:var(--green);color:#fff}
.empty{padding:48px 20px;text-align:center;border:1px dashed #d9d4c8;color:var(--muted);background:#fffefa70}.empty strong{display:block;font:500 18px var(--serif);color:#55584d;margin-bottom:5px}.empty .btn{margin-top:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-head h3{font:500 19px var(--serif);margin:0}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.feature-note{background:#e9ece3;padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.feature-note h3{font:500 22px var(--serif);margin:8px 0}.feature-note p{color:#656b5e;font-size:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field small{font-size:10px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#1d211db0;z-index:50;display:grid;place-items:center;padding:16px}.modal{background:var(--paper);width:min(720px,100%);max-height:90vh;overflow:auto;padding:23px;border:1px solid var(--line);box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font:500 23px var(--serif);margin:0}.close{border:0;background:none;font-size:25px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:17px;padding:22px;background:var(--white);border:1px solid var(--line);margin-bottom:18px}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#e4dfd2;font:24px var(--serif);color:var(--green)}.stats{display:flex;gap:25px;margin-left:auto;text-align:center}.stats strong{display:block;font:22px var(--serif)}.stats span{font-size:10px;color:var(--muted)}
.reader{max-width:780px;margin:auto;background:var(--white);border:1px solid var(--line);padding:clamp(22px,5vw,55px)}.reader h1{font:500 34px/1.5 var(--serif);margin:15px 0}.readertext{font:16px/2.05 var(--serif);white-space:pre-wrap;margin:30px 0}.reader-tools{display:flex;gap:8px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.notice{padding:12px;background:#f0eee7;color:#69695f;font-size:11px;line-height:1.8}.itemline{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.itemline:first-child{border-top:0}.muted{color:var(--muted)}.small{font-size:11px}.footer{border-top:1px solid var(--line);padding:22px clamp(16px,4vw,58px);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:10px;letter-spacing:.06em}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:11px 18px;z-index:90;box-shadow:var(--shadow);font-size:12px;max-width:90vw}
.banner{background:#f3e9d7;border-bottom:1px solid #e0cfb0;color:#6b5636;padding:10px clamp(16px,4vw,58px);font-size:12px;line-height:1.7}
@media(max-width:980px){.nav{gap:10px}.nav button{font-size:11px}.top-actions .desktop{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.topbar{height:64px;padding:0 14px}.brand{min-width:0}.brand-mark{width:38px;height:38px}.brand-name{font-size:18px}.nav{display:none;position:absolute;top:63px;left:0;right:0;background:var(--white);padding:10px 18px 18px;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0}.nav.open{display:flex}.nav button{text-align:left;padding:12px 0}.mobile-menu{display:block}.hero{grid-template-columns:1fr;gap:20px;padding-top:15px}.hero-art{height:250px}.grid,.grid.two,.split{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.profile{align-items:flex-start;flex-wrap:wrap}.stats{margin-left:0;width:100%;justify-content:space-around}.main{padding-top:24px}.page-title h1{font-size:31px}}
</style>
</head>

<script>

const appStorage = (() => {
 const memory = Object.create(null);
 const has = k => Object.prototype.hasOwnProperty.call(memory,k);
 return {
  getItem(key){if(has(key))return memory[key];try{return window.localStorage.getItem(key)}catch(e){return null}},
  // true = really persisted in the browser, false = only kept in memory (lost on reload)
  setItem(key,value){try{window.localStorage.setItem(key,String(value));delete memory[key];return true}catch(e){memory[key]=String(value);return false}},
  removeItem(key){try{window.localStorage.removeItem(key)}catch(e){} delete memory[key]},
  probe(){try{const k='jjalsomo_probe';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true}catch(e){return false}}
 };
})();

const KEY='jjalsomo_proto_v2';

/* ───────── v14 helpers (defined before loadDB runs) ───────── */
// One ID generator with fallbacks: crypto.randomUUID is missing on non-secure (http) pages.
function uid(){
 try{
  if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
  if(window.crypto&&crypto.getRandomValues){
   const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
   const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
   return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
 }catch(e){}
 return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
let storageOK=appStorage.probe();
const bootNotices=[],bootToasts=[];
function updateBanner(){
 const el=document.getElementById('storageBanner');if(!el)return;
 const msgs=[...bootNotices];
 if(!storageOK)msgs.push('이 브라우저에서는 데이터를 저장하지 못하고 있습니다. 지금 작성한 내용은 페이지를 새로고침하거나 닫으면 사라집니다.');
 el.hidden=!msgs.length;
 el.innerHTML=msgs.map(esc).join('<br>');
}

let db=loadDB(),page=(location.hash==='#operator'?'operator':'home'),activeId=null,readerFont=16,readerLine=2.05;
let appView='community';
db.works.forEach(w=>{if(w.ownerId&&!db.qualifiedAuthors.includes(w.ownerId))db.qualifiedAuthors.push(w.ownerId)});
if(db.works.length)save();
function loadDB(){
 const defaults={works:[],requests:[],comments:{},bookmarks:[],follows:[],notifications:[],progress:{},reviews:[],newsletter:[],deletionLogs:[],qualifiedAuthors:[],authorProfiles:{}};
 try{
  const raw=appStorage.getItem(KEY);
  const saved=raw?JSON.parse(raw):{};
  const d=saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{};
  const out={...defaults,...d};
  ['works','requests','bookmarks','follows','notifications','reviews','newsletter','deletionLogs','qualifiedAuthors'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[]});
  ['comments','progress','authorProfiles'].forEach(k=>{if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]={}});
  out.works.forEach(w=>{if(w&&typeof w==='object'&&w.type!=='essay')w.type='fiction'}); // 작품 유형: 기존 작품은 전부 소설로 간주 (결정 B)
  return out;
 }catch(e){
  console.warn('저장된 시제품 데이터를 복구할 수 없어 빈 데이터로 시작합니다.',e);
  try{const bad=appStorage.getItem(KEY);if(bad){const bk=KEY+'_corrupt_backup_'+Date.now();bootNotices.push(appStorage.setItem(bk,bad)?'저장된 데이터를 읽을 수 없어 원본을 "'+bk+'" 항목에 백업하고 빈 상태로 시작했습니다.':'저장된 데이터를 읽을 수 없습니다. 원본 백업에도 실패했으니 새로 저장하기 전에 브라우저 저장소를 확인해 주세요.')}}catch(_){}
  return defaults;
 }
}
function memberId(){let id=appStorage.getItem('jjalsomo_member_id');if(!id){id=uid();appStorage.setItem('jjalsomo_member_id',id)}return id}
function canJoinWorkshop(){return db.qualifiedAuthors.includes(memberId())||db.works.some(w=>w.ownerId===memberId())}
function qualifyAuthor(){let id=memberId();if(!db.qualifiedAuthors.includes(id)){db.qualifiedAuthors.push(id);save()}}
function myAuthorProfile(){let id=memberId();return db.authorProfiles[id]||{name:appStorage.getItem('jjalsomo_display_name')||'',intro:'',direction:'',featuredWorkId:''}}
function saveMyAuthorProfile(profile){db.authorProfiles[memberId()]={...myAuthorProfile(),...profile};save()}

function save(){let ok=false;try{ok=appStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('저장 실패',e)}if(ok!==storageOK){storageOK=ok;updateBanner();if(!ok)toast('이 브라우저에 저장하지 못했습니다. 새로고침하면 방금 작업이 사라질 수 있습니다.')}return ok}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function softDelete(type,id,parentId=null){let collection=type==='work'?db.works:type==='request'?db.requests:null;let item=collection?collection.find(x=>x.id===id):(type==='comment'?(db.comments[parentId]||[]).find(x=>x.id===id):null);if(!item||item.ownerId!==memberId()){toast('본인이 작성한 콘텐츠만 삭제할 수 있습니다.');return}if(!confirm('이 콘텐츠를 삭제할까요? 삭제 후 일반 화면에서는 보이지 않습니다.'))return;let log={id:uid(),type,contentId:id,parentId:parentId||null,authorId:item.ownerId,deletedAt:new Date().toISOString(),reason:'작성자 직접 삭제'};db.deletionLogs.push(log);if(type==='work'){db.works=db.works.filter(x=>x.id!==id);db.bookmarks=db.bookmarks.filter(x=>x!==id);delete db.comments[id];delete db.progress[id]}else if(type==='request'){db.requests=db.requests.filter(x=>x.id!==id)}else if(type==='comment'){db.comments[parentId]=db.comments[parentId].filter(x=>x.id!==id)}save();render();toast('콘텐츠를 삭제하고 삭제 이력을 보존했습니다.')}
function toast(s){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',s.length>60?5000:2500)}
function go(p){if(p==='room'&&!canJoinWorkshop()){toast('짧글모에 작품을 한 편 이상 발표하면 합평실을 이용할 수 있습니다.');return}if(p!=='operator'&&location.hash==='#operator'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}page=p;render();document.getElementById('nav').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
function nav(){
 const el=document.getElementById('nav');
 const items=[['home','오늘의 문학'],['search','작품 검색'],['library','작품관'],['curation','문학 큐레이션'],['authors','작가'],...(canJoinWorkshop()?[['room','합평실']]:[]),['desk','내 서재']];
 el.innerHTML=items.map(([k,l])=>`<button data-page="${k}" data-go="${k}">${l}</button>`).join('');
 el.style.display='';
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const a=document.querySelector('.top-actions');
 a.innerHTML=`<button class="btn desktop" onclick="openStoryForm()">작품 발표하기</button><button class="iconbtn" data-go="notifications" title="알림" aria-label="알림">♧</button><button class="btn primary desktop" data-go="desk">내 서재</button><button class="mobile-menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>`;
}
function operator(){return `${title('ADMINISTRATION','운영자 대시보드','짧글모의 콘텐츠와 커뮤니티 운영 현황을 확인합니다.','<button class="btn" onclick="go(\'room\')">합평실 열기 →</button>')}<div class="grid"><div class="panel"><div class="eyebrow">PUBLISHED WORKS</div><h2 style="font:500 30px var(--serif)">${db.works.length}</h2><p class="muted small">등록된 작품</p><button class="btn" data-go="library">작품 관리</button></div><div class="panel"><div class="eyebrow">WORKSHOP REQUESTS</div><h2 style="font:500 30px var(--serif)">${db.requests.length}</h2><p class="muted small">합평 요청</p><button class="btn" data-go="room">합평실 관리</button></div><div class="panel"><div class="eyebrow">DELETION LOGS</div><h2 style="font:500 30px var(--serif)">${db.deletionLogs.length}</h2><p class="muted small">삭제 이력</p><button class="btn" data-go="deletions">이력 확인</button></div></div><div class="panel" style="margin-top:18px"><h3 style="font:500 19px var(--serif)">운영 도구</h3><div class="itemline"><strong>합평실 관리</strong><button class="btn primary" data-go="room">열기</button></div><div class="itemline"><strong>삭제 이력 관리</strong><button class="btn" data-go="deletions">열기</button></div><div class="itemline"><strong>작품관</strong><button class="btn" data-go="library">열기</button></div></div><div class="notice" style="margin-top:16px">이 화면은 주소 끝에 <strong>#operator</strong>를 붙여 들어오는 <strong>테스트용 진입로</strong>입니다. 실제 서비스에서는 운영자 계정 인증과 서버 측 권한 검증이 필요합니다. 현재는 화면 분리만 구현한 시제품입니다.</div>`}
function deletionAdmin(){let logs=[...db.deletionLogs].reverse();return `${title('AUDIT LOG','삭제 이력 관리','운영자 화면에서 삭제 기록의 최소 메타데이터를 확인합니다.')}<div class="panel">${logs.length?logs.map(x=>`<div class="itemline"><div><strong>${esc(({work:'작품',request:'합평 요청',comment:'댓글'})[x.type]||x.type)}</strong><div class="small muted">콘텐츠 ID: ${esc(x.contentId)} · 작성자 ID: ${esc(x.authorId||'기록 없음')}</div><div class="small muted">${esc(x.deletedAt)} · ${esc(x.reason||'사유 없음')}</div></div><span class="tag">삭제됨</span></div>`).join(''):empty('삭제 이력이 없습니다.','작성자가 콘텐츠를 삭제하면 이곳에 표시됩니다.')}</div>`}

// Core presentation helpers used by every page.
function title(kicker, heading, description='', action=''){
 return `<section class="page-title"><div class="eyebrow">${esc(kicker)}</div><h1>${esc(heading)}</h1><p>${esc(description)}</p>${action?`<div style="margin-top:15px">${action}</div>`:''}</section>`;
}
function empty(heading, description='', action=''){
 return `<section class="empty"><strong>${esc(heading)}</strong><span>${esc(description)}</span>${action?`<div>${action}</div>`:''}</section>`;
}
function card(w,extra){
 const genres=workGenres(w);
 const id=esc(w.id||'');
 const titleText=esc(w.title||'제목 없는 작품');
 const author=esc(w.author||'작가 미상');
 const intro=esc(w.intro||'작품 소개가 등록되지 않았습니다.');
 const genreTags=genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('');
 const extraHtml=typeof extra==='string'?extra:''; // .map(card) passes the index as 2nd arg
 return `<article class="card" role="button" tabindex="0" data-act="openReader" data-a="${id}">
  <div class="eyebrow">${w.type==='essay'?'ESSAY':'SHORT FICTION'}</div>
  <h3>${titleText}</h3>
  <p>${intro}</p>
  <div class="chips">${genreTags}</div>${extraHtml}
  <div class="meta"><span>${author}</span><span>${esc(w.created||'')}</span></div>
 </article>`;
}

<div class="split" style="margin-top:28px"><div class="panel"><div class="eyebrow">THE WORKSHOP</div><h2 style="font:500 24px var(--serif)">함께 읽고, 더 깊이 쓰기</h2><p class="muted small">작품 발표 회원끼리 원고를 교환하고 창작 방향에 맞는 구체적인 피드백을 나눠 보세요.</p><button class="btn primary" data-go="room">합평실 둘러보기</button></div><div class="feature-note"><div class="eyebrow">EDITORIAL CURATION</div><div><h3>좋은 이야기를<br>새로운 독자에게</h3><p>주제별 큐레이션은 작품이 등록되면 운영자가 선정해 소개하는 공간입니다.</p></div><button class="btn" data-go="curation">큐레이션 보기</button></div></div>
<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>짧글모 레터</h3><span class="tag">격주 발행 예정</span></div><p class="muted small">새로운 작품과 작가, 문학적 질문을 이메일로 받아보세요.</p><div class="row-actions"><input class="input" id="letterEmail" type="email" placeholder="이메일 주소" style="max-width:320px"><button class="btn primary" onclick="subscribe()">구독 신청</button></div><small class="muted">시제품에서는 신청 정보가 이 브라우저에만 저장됩니다.</small></div>`}
let libGenre='전체',libType='전체',libQuery='',curTag='전체';
const GENRES=['호러','액션','회고록','성장물','SF','느와르','판타지','추리','스릴러','로맨스'];
function workGenres(w){return w.genres||String(w.genre||'').split(',').map(x=>x.trim()).filter(Boolean)}
// 취미별 구분: 문학(소설)/비문학(에세이). 작품 데이터의 type('fiction'|'essay')을 기준으로 판정한다.
function matchesType(w,t){return t==='전체'||(w.type||'fiction')===t}
function typeChips(cur,varName,onChange){return ['전체','fiction','essay'].map(t=>`<button class="chip ${cur===t?'active':''}" onclick="${varName}='${t}';${onChange}">${t==='전체'?'전체':(t==='fiction'?'문학':'비문학')}</button>`).join('')}
function library(){let list=db.works.filter(w=>(libGenre==='전체'||workGenres(w).includes(libGenre))&&matchesType(w,libType)&&(`${w.title} ${w.author} ${w.intro} ${w.body} ${workGenres(w).join(' ')}`).toLowerCase().includes(libQuery.toLowerCase()));return `${title('THE LIBRARY','작품관','제목, 작가, 장르를 기준으로 작품을 찾아보세요.','<button class="btn primary" onclick="openStoryForm()">＋ 작품 발표하기</button>')}<div class="toolbar"><div class="search"><input class="input" placeholder="작품·작가·장르 검색" value="${esc(libQuery)}" oninput="libQuery=this.value;renderLibraryList()"></div><div class="chips">${['전체',...GENRES].map(g=>`<button class="chip ${libGenre===g?'active':''}" onclick="libGenre='${g}';go('library')">${g}</button>`).join('')}</div></div><div class="chips" style="margin:-6px 0 18px">${typeChips(libType,'libType',"go('library')")}</div><div id="libraryList">${libraryList(list)}</div>`}
let searchQuery='',searchGenre='전체',searchType='전체',searchSort='latest';
function searchWorks(){
 const q=searchQuery.trim().toLowerCase();
 let list=db.works.filter(w=>{
  const genres=workGenres(w);
  const hay=[w.title,w.author,w.intro,w.body,...genres].join(' ').toLowerCase();
  return (!q||hay.includes(q))&&(searchGenre==='전체'||genres.includes(searchGenre))&&matchesType(w,searchType);
 });
 if(searchSort==='title') list.sort((a,b)=>a.title.localeCompare(b.title,'ko'));
 else if(searchSort==='author') list.sort((a,b)=>(a.author||'').localeCompare(b.author||'','ko'));
 else list.reverse();
 return list;
}
function searchPage(){
 const list=searchWorks();
 return `${title('FIND A STORY','작품 검색','모든 회원이 작품을 탐색하고 읽을 수 있습니다. 제목, 작가명, 장르와 본문으로 검색하세요.')}
 <section class="panel" style="padding:22px">
  <div class="search" style="max-width:none">
   <input id="mainSearchInput" class="input" style="font-size:15px;padding:15px" placeholder="예: 고독, 우주, 작가명, 추리…" value="${esc(searchQuery)}" oninput="searchQuery=this.value;renderSearchResults()" onkeydown="if(event.key==='Enter'){searchQuery=this.value;renderSearchResults()}">
  </div>
  <div class="toolbar" style="margin-bottom:0">
   <div class="chips">${['전체',...GENRES].map(g=>`<button class="chip ${searchGenre===g?'active':''}" onclick="searchGenre='${g}';renderSearchResults()">${g}</button>`).join('')}</div>
   <select class="select" style="max-width:160px" onchange="searchSort=this.value;renderSearchResults()">
    <option value="latest" ${searchSort==='latest'?'selected':''}>최신 등록순</option>
    <option value="title" ${searchSort==='title'?'selected':''}>제목순</option>
    <option value="author" ${searchSort==='author'?'selected':''}>작가명순</option>
   </select>
  </div>
  <div class="chips" style="margin-top:9px">${typeChips(searchType,'searchType','renderSearchResults()')}</div>
 </section>
 <div id="searchResults" style="margin-top:22px">${searchResultsMarkup(list)}</div>`;
}
function searchResultsMarkup(list){
 return `<div class="section-head"><div><div class="eyebrow">SEARCH RESULTS</div><h2>${list.length}개의 작품</h2><p>검색어와 장르 조건에 맞는 작품입니다.</p></div></div>`+
 (list.length?`<div class="grid">${list.map(card).join('')}</div>`:empty('검색 결과가 없습니다.','다른 검색어를 입력하거나 장르 필터를 바꿔 보세요.'));
}
function renderSearchResults(){
 const el=document.getElementById('searchResults');
 if(el) el.innerHTML=searchResultsMarkup(searchWorks());
}
function libraryList(list){return list.length?`<div class="grid">${list.map(card).join('')}</div>`:empty('찾은 작품이 없습니다.','검색어를 바꾸거나 첫 작품을 등록해 보세요.','<button class="btn" onclick="openStoryForm()">작품 등록하기</button>')}
function renderLibraryList(){let el=document.getElementById('libraryList');if(el){let list=db.works.filter(w=>(libGenre==='전체'||workGenres(w).includes(libGenre))&&matchesType(w,libType)&&(`${w.title} ${w.author} ${w.intro} ${w.body} ${workGenres(w).join(' ')}`).toLowerCase().includes(libQuery.toLowerCase()));el.innerHTML=libraryList(list)}}
function curation(){let tags=['전체',...GENRES];let list=db.works.filter(w=>curTag==='전체'||workGenres(w).includes(curTag));return `${title('READ BY GENRE','장르별 큐레이션','장르를 선택해 취향에 맞는 작품을 발견해 보세요.')}<div class="chips" style="margin:18px 0">${tags.map(t=>`<button class="chip ${curTag===t?'active':''}" onclick="curTag='${t}';go('curation')">${t}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:empty('이 장르에 등록된 작품이 없습니다.','작품이 등록되면 선택한 장르에 따라 이곳에 모아집니다.')}`}
let roomGenre='전체',roomDirection='전체';
function room(){if(!canJoinWorkshop())return `${title('AUTHOR SPACE','합평실','짧글모에 작품을 한 편 이상 발표한 회원만 참여할 수 있습니다.')}<div class="panel"><h3 style="font:500 20px var(--serif)">합평실 이용 자격이 아직 없습니다.</h3><p class="muted small">첫 작품을 짧글모에 발표하면 합평실 이용 자격이 부여됩니다. 이후 작품을 삭제해도 자격은 유지됩니다.</p><button class="btn primary" onclick="openStoryForm()">첫 작품 발표하기</button></div>`;let dirs=['전체','사실주의','철학적·사유적','사회비판적','심리·내면 탐구','실험적·전위적','서사 중심','미니멀리즘'];let list=db.requests.filter(r=>(roomGenre==='전체'||(r.genres||String(r.genre||'').split(',').map(x=>x.trim())).includes(roomGenre))&&(roomDirection==='전체'||(r.directions||[]).includes(roomDirection)));return `${title('THE WORKSHOP','합평실','합평 참여 가능 회원만 참여할 수 있는 비공개 상호 합평 공간입니다.','<button class="btn primary" onclick="openRequestForm()">＋ 합평 요청 작성</button>')}<div class="toolbar"><div class="chips">${['전체',...GENRES].map(g=>`<button class="chip ${roomGenre===g?'active':''}" onclick="roomGenre='${g}';go('room')">${g}</button>`).join('')}</div><select class="select" style="max-width:190px" onchange="roomDirection=this.value;go('room')">${dirs.map(d=>`<option ${roomDirection===d?'selected':''}>${d}</option>`).join('')}</select></div>${list.length?`<div class="grid">${list.map(r=>`<article class="card"><div>${(r.directions||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag green">${esc(r.genre)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p><div class="small muted">원하는 피드백: ${(r.feedback||[]).map(esc).join(' · ')}</div><div class="meta"><span>${esc(r.author)} · 리뷰어 ${esc(r.people)}명 희망</span><span>${r.ownerId===memberId()?`<button class="btn" data-act="softDelete" data-a="request" data-b="${esc(r.id)}">요청 삭제</button>`:''}<button class="btn soft" data-act="joinReview" data-a="${esc(r.id)}">합평 참여</button></span></div></article>`).join('')}</div>`:empty('열린 합평 요청이 없습니다.','첫 합평 요청을 등록하거나, 나중에 다른 작가의 요청을 확인해 보세요.','<button class="btn primary" onclick="openRequestForm()">합평 요청 작성</button>')}`}
function authors(){
 let owners=[...new Set(db.works.map(w=>w.ownerId).filter(Boolean))];
 let legacy=[...new Set(db.works.filter(w=>!w.ownerId).map(w=>w.author).filter(Boolean))];
 let cards=owners.map(id=>{
   let works=db.works.filter(w=>w.ownerId===id),p=db.authorProfiles[id]||{};
   let name=p.name||works[0]?.author||'작가';
   return `<article class="card"><div class="avatar">${esc(name.slice(0,1))}</div><h3>${esc(name)}</h3><p>${esc(p.intro||'아직 작가 소개가 등록되지 않았습니다.')}</p><p class="muted small">발표 작품 ${works.length}편 · ${[...new Set(works.flatMap(w=>workGenres(w)))].join(', ')}</p><button class="btn" data-act="authorDetailById" data-a="${esc(id)}">작가 페이지 보기</button></article>`;
 }).join('');
 cards+=legacy.map(n=>{let works=db.works.filter(w=>w.author===n&&!w.ownerId);return `<article class="card"><div class="avatar">${esc(n.slice(0,1))}</div><h3>${esc(n)}</h3><p class="muted small">발표 작품 ${works.length}편</p><button class="btn" data-act="authorDetail" data-a="${esc(n)}">작가 페이지 보기</button></article>`}).join('');
 return `${title('WRITERS','작가','작가의 소개와 창작 방향, 발표 작품을 살펴보세요.')}<div class="grid">${cards||empty('아직 소개할 작가가 없습니다.','작품을 발표하면 작가 아카이브가 만들어집니다.','<button class="btn primary" onclick="openStoryForm()">작품 발표하기</button>')}</div>`;
}
function authorDetailById(id){
 let works=db.works.filter(w=>w.ownerId===id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 let p=db.authorProfiles[id]||{},name=p.name||works[0]?.author||'작가',featured=works.find(w=>w.id===p.featuredWorkId);
 let activity=works.map(w=>`<div class="itemline"><div><strong>${esc(w.title)}</strong><div class="small muted">${esc(w.created||'발표일 미기록')} · ${esc(workGenres(w).join(', '))}</div></div><button class="btn" data-act="openReader" data-a="${esc(w.id)}">읽기</button></div>`).join('');
 modal(esc(name),`<div class="profile"><div class="avatar">${esc(name.slice(0,1))}</div><div><h3 style="margin:0">${esc(name)}</h3><p class="muted small">짧글모 작가 아카이브</p></div></div>
 <section class="panel" style="margin:14px 0"><h3>작가 소개</h3><p>${esc(p.intro||'작가 소개가 아직 등록되지 않았습니다.')}</p><h3>창작 방향</h3><p>${esc(p.direction||'창작 방향이 아직 등록되지 않았습니다.')}</p></section>
 <section class="panel"><div class="panel-head"><h3>대표작</h3></div>${featured?`<div class="itemline"><strong>${esc(featured.title)}</strong><button class="btn primary" data-act="closeOpenReader" data-a="${esc(featured.id)}">대표작 읽기</button></div>`:'<p class="muted small">대표작이 지정되지 않았습니다.</p>'}</section>
 <section class="panel" style="margin-top:14px"><div class="panel-head"><h3>발표 작품 아카이브</h3><span class="tag">${works.length}편</span></div>${activity||'<p class="muted small">발표 작품이 없습니다.</p>'}</section>
 <section class="panel" style="margin-top:14px"><h3>작품 활동 기록</h3><p class="muted small">짧글모에 발표한 작품과 발표일을 기준으로 정리한 기록입니다.</p>${works.length?`<p>${works.length}편의 작품 발표 · 최근 발표 ${esc(works[0].created||'날짜 미기록')}</p>`:'아직 활동 기록이 없습니다.'}</section>
 <button class="btn ${db.follows.includes(name)?'':'primary'}" style="margin-top:14px" data-act="toggleFollow" data-a="${esc(name)}">${db.follows.includes(name)?'구독 취소':'작가 구독하기'}</button>`,true);
}
function authorDetail(n){let works=db.works.filter(w=>w.author===n);modal(esc(n),`<p class="muted small">기존 작품의 작가 아카이브</p><h3>발표 작품</h3>${works.map(w=>`<div class="itemline"><span>${esc(w.title)} <small class="muted">· ${esc(workGenres(w).join(', '))}</small></span><button class="btn" data-act="closeOpenReader" data-a="${esc(w.id)}">읽기</button></div>`).join('')}<button class="btn ${db.follows.includes(n)?'':'primary'}" data-act="toggleFollow" data-a="${esc(n)}">${db.follows.includes(n)?'구독 취소':'작가 구독하기'}</button>`)}
function desk(){let comments=Object.values(db.comments).flat().length;return `${title('MY DESK','내 서재','읽기 기록과 창작 활동, 받은 피드백을 관리하세요.')}<div class="profile"><div class="avatar">書</div><div><h2 style="font:500 22px var(--serif);margin:0">나의 창작 공간</h2><p class="muted small">작가 소개와 창작 방향, 대표작을 설정할 수 있습니다.</p><button class="btn" onclick="editProfile()">작가 프로필 편집</button></div><div class="stats"><div><strong>${db.progress?Object.keys(db.progress).length:0}</strong><span>읽은 작품</span></div><div><strong>${comments}</strong><span>남긴 감상</span></div><div><strong>${db.reviews.length}</strong><span>합평 활동</span></div></div></div><div class="grid two"><section class="panel"><div class="panel-head"><h3>북마크</h3><span class="tag">${db.bookmarks.length}개</span></div>${db.bookmarks.length?db.bookmarks.map(id=>db.works.find(w=>w.id===id)).filter(Boolean).map(w=>`<div class="itemline"><span>${esc(w.title)}</span><button class="btn" data-act="openReader" data-a="${esc(w.id)}">이어 읽기</button></div>`).join(''):empty('저장한 작품이 없습니다.','읽다가 다시 보고 싶은 작품을 북마크해 보세요.')}</section><section class="panel"><div class="panel-head"><h3>내가 발표한 작품</h3><button class="btn" onclick="openStoryForm()">＋ 등록</button></div>${db.works.filter(w=>w.ownerId===memberId()).length?db.works.filter(w=>w.ownerId===memberId()).map(w=>`<div class="itemline"><span>${esc(w.title)} <small class="muted">${esc(w.genre)}</small></span><span><button class="btn" data-act="openReader" data-a="${esc(w.id)}">보기</button> <button class="btn" data-act="softDelete" data-a="work" data-b="${esc(w.id)}">삭제</button></span></div>`).join(''):empty('아직 발표한 작품이 없습니다.','첫 작품을 등록해 보세요.')}</section><section class="panel"><div class="panel-head"><h3>창작 성장 기록</h3><span class="tag">개인 기록</span></div><div class="stats" style="margin:0;justify-content:space-around"><div><strong>${db.works.length}</strong><span>발표 작품</span></div><div><strong>${db.reviews.length}</strong><span>작성한 합평</span></div><div><strong>${comments}</strong><span>독자 감상</span></div></div><p class="muted small" style="margin-top:18px">현재 통계는 이 브라우저에서 직접 등록한 시제품 데이터만 집계합니다.</p></section><section class="panel"><div class="panel-head"><h3>삭제 이력</h3><span class="tag">${db.deletionLogs.filter(x=>x.authorId===memberId()).length}건</span></div><p class="muted small">삭제한 콘텐츠는 일반 화면에서 사라집니다. 이곳에는 콘텐츠 본문이 아닌 삭제 종류와 시각만 표시합니다.</p>${db.deletionLogs.filter(x=>x.authorId===memberId()).length?db.deletionLogs.filter(x=>x.authorId===memberId()).slice().reverse().map(x=>`<div class="itemline"><span>${({work:'작품',comment:'독자 감상',request:'합평 요청'}[x.type]||'콘텐츠')} 삭제</span><small class="muted">${new Date(x.deletedAt).toLocaleString('ko-KR')}</small></div>`).join(''):'<p class="muted small">아직 삭제 이력이 없습니다.</p>'}</section><section class="panel"><div class="panel-head"><h3>읽기 환경</h3></div><p class="small muted">글자 크기와 줄 간격은 작품 읽기 화면에서 조절할 수 있습니다.</p><button class="btn" data-go="library">작품 읽으러 가기</button></section></div>`}
function notifications(){return `${title('NOTIFICATIONS','알림 센터','합평 참여, 독자 반응, 팔로우한 작가의 새 작품 소식을 모아봅니다.')} ${db.notifications.length?db.notifications.slice().reverse().map(n=>`<div class="itemline"><span>${esc(n.text)}</span><small class="muted">${esc(n.date)}</small></div>`).join(''):empty('새로운 알림이 없습니다.','작품이나 합평 활동이 생기면 이곳에서 확인할 수 있습니다.')}`}
function openReader(id){let w=db.works.find(x=>x.id===id);if(!w)return;activeId=id;page='reader';render();window.scrollTo(0,0)}
function reader(){let w=db.works.find(x=>x.id===activeId);if(!w)return empty('작품을 찾을 수 없습니다.','작품관에서 다른 작품을 선택해 주세요.');let saved=db.bookmarks.includes(w.id),progress=db.progress[w.id]||0;return `<div class="reader"><button class="btn" data-go="library">← 작품관</button><div class="eyebrow" style="margin-top:25px">${w.type==='essay'?'에세이':'소설'} · ${esc(w.genre)} · ${esc(w.readTime||'5분 읽기')}</div><h1>${esc(w.title)}</h1><div class="muted small">${esc(w.author)} · ${esc(w.created||'방금 등록')}</div><div class="reader-tools" style="margin-top:20px"><button class="btn" onclick="adjustReader(-1,0)">가−</button><button class="btn" onclick="adjustReader(1,0)">가＋</button><button class="btn" onclick="adjustReader(0,-.15)">줄 간격 −</button><button class="btn" onclick="adjustReader(0,.15)">줄 간격 ＋</button><button class="btn ${saved?'soft':''}" data-act="toggleBookmark" data-a="${esc(w.id)}">${saved?'♥ 저장됨':'♡ 북마크'}</button><button class="btn" data-act="shareWork" data-a="${esc(w.id)}">공유</button></div><div class="readertext" id="readerText" style="font-size:${readerFont}px;line-height:${readerLine}">${esc(w.body)}</div><div class="toolbar"><span class="small muted">읽기 진행</span><input type="range" min="0" max="100" value="${progress}" style="max-width:200px" data-input="progress" data-a="${esc(w.id)}"><strong id="progressLabel" class="small">${progress}%</strong></div><div class="panel" style="margin-top:22px"><h3 style="font:500 20px var(--serif)">독자의 감상</h3><p class="muted small">모든 회원이 작품에 감상을 남길 수 있습니다. 합평은 합평 참여 가능 회원의 합평실에서 별도로 진행됩니다.</p><textarea class="textarea" id="commentText" placeholder="작품을 읽고 느낀 점을 적어 주세요."></textarea><button class="btn primary" style="margin-top:10px" data-act="addComment" data-a="${esc(w.id)}">감상 등록</button><div style="margin-top:15px">${(db.comments[w.id]||[]).map(c=>`<div class="itemline"><span>${esc(c.text)}</span><span><small class="muted">${esc(c.date)}</small> ${c.ownerId===memberId()?`<button class="btn" data-act="softDelete" data-a="comment" data-b="${esc(c.id)}" data-c="${esc(w.id)}">삭제</button>`:''}</span></div>`).join('')||'<p class="muted small">아직 등록된 감상이 없습니다.</p>'}</div></div></div>`}
function adjustReader(f,l){readerFont=Math.max(13,Math.min(24,readerFont+f));readerLine=Math.max(1.5,Math.min(2.8,readerLine+l));let el=document.getElementById('readerText');if(el){el.style.fontSize=readerFont+'px';el.style.lineHeight=readerLine}}
function toggleBookmark(id){db.bookmarks=db.bookmarks.includes(id)?db.bookmarks.filter(x=>x!==id):[...db.bookmarks,id];save();render();toast('북마크를 업데이트했습니다.')}
function shareWork(id){let w=db.works.find(x=>x.id===id);if(navigator.clipboard){navigator.clipboard.writeText(location.href+'#'+encodeURIComponent(w.title)).then(()=>toast('공유용 주소를 복사했습니다.')).catch(()=>toast('공유 주소 복사 기능은 브라우저에서 제한될 수 있습니다.'))}else toast('공유 기능은 이 브라우저에서 제한됩니다.')}
function addComment(id){let el=document.getElementById('commentText');if(!el.value.trim())return toast('감상을 입력해 주세요.');(db.comments[id]??=[]).push({id:uid(),ownerId:memberId(),text:el.value.trim(),date:new Date().toLocaleDateString('ko-KR')});db.notifications.push({text:'작품에 독자 감상이 등록되었습니다.',date:new Date().toLocaleString('ko-KR')});save();render();toast('감상을 등록했습니다.')}
function openStoryForm(){modal('작품 발표하기',`<form id="storyForm" class="formgrid"><div class="field full"><label>작품 유형 *</label><div class="options"><label class="option" style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="worktype" value="fiction" checked>소설</label><label class="option" style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="worktype" value="essay">에세이</label></div></div><div class="field"><label>작품 제목 *</label><input class="input" name="title" required></div><div class="field"><label>작가명 *</label><input class="input" name="author" required placeholder="작가명 또는 필명" value="${esc(myAuthorProfile().name)}"></div><div class="field"><label>예상 읽기 시간</label><select class="select" name="readTime"><option>3분 읽기</option><option selected>5분 읽기</option><option>7분 읽기</option><option>10분 읽기</option></select></div><div class="field full"><label>작품 소개</label><textarea class="textarea" name="intro" placeholder="작품을 소개해 주세요."></textarea></div><div class="field full"><label>장르 <small>(여러 개 선택 가능)</small></label><div class="options genre-options">${['호러','액션','회고록','성장물','SF','느와르','판타지','추리','스릴러','로맨스'].map(x=>`<button type="button" class="option" onclick="this.classList.toggle('selected')">${x}</button>`).join('')}</div></div><div class="field full"><label>작품 원문 *</label><textarea class="textarea" name="body" required style="min-height:200px" placeholder="직접 작성한 작품을 입력해 주세요."></textarea></div><div class="field full notice">저작권은 작가에게 남습니다. 시제품 데이터는 현재 브라우저에 저장되며 서버로 전송되지 않습니다.</div><div class="field full" style="text-align:right"><button class="btn primary">작품 등록</button></div></form>`,true);document.getElementById('storyForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),genres=[...e.target.querySelectorAll('.genre-options .option.selected')].map(x=>x.textContent);if(!genres.length)return toast('장르를 하나 이상 선택해 주세요.');db.works.push({id:uid(),ownerId:memberId(),type:f.get('worktype')==='essay'?'essay':'fiction',title:f.get('title'),author:f.get('author'),genre:genres.join(', '),genres,readTime:f.get('readTime'),intro:f.get('intro'),body:f.get('body'),tags:genres,created:new Date().toLocaleDateString('ko-KR'),createdAt:Date.now()});qualifyAuthor();save();closeModal();go('library');toast(storageOK?'작품을 발표했습니다. 합평실 이용 자격을 획득했습니다.':'작품을 발표했지만 이 브라우저에 저장하지 못했습니다. 새로고침하면 사라집니다.')}} 
function openRequestForm(){if(!canJoinWorkshop()){toast('짧글모에 작품을 한 편 이상 발표하면 합평실을 이용할 수 있습니다.');return}modal('합평 요청 작성',`<form id="requestForm" class="formgrid"><div class="field"><label>작품 제목 *</label><input class="input" name="title" required></div><div class="field"><label>작가명 *</label><input class="input" name="author" required></div><div class="field"><label>원하는 리뷰어</label><select class="select" name="people"><option>2</option><option selected>3</option></select></div><div class="field full"><label>장르 <small>(여러 개 선택 가능)</small></label><div class="options genre-options">${GENRES.map(x=>`<button type="button" class="option" onclick="this.classList.toggle('selected')">${x}</button>`).join('')}</div></div><div class="field full"><label>창작 방향</label><div class="options">${['사실주의','철학적·사유적','사회비판적','심리·내면 탐구','실험적·전위적','서사 중심','미니멀리즘'].map(x=>`<button type="button" class="option" onclick="this.classList.toggle('selected')">${x}</button>`).join('')}</div></div><div class="field full"><label>받고 싶은 피드백</label><div class="options">${['문장·문체','인물·심리','플롯·구성','주제·의미','독자 감상','강점과 개선점'].map(x=>`<button type="button" class="option" onclick="this.classList.toggle('selected')">${x}</button>`).join('')}</div></div><div class="field full"><label>작품 소개</label><textarea class="textarea" name="summary"></textarea></div><div class="field full notice">합평 원고는 합평 참여자에게만 공개되는 것을 기본으로 설계합니다. 현재는 브라우저 시제품이며 서버 권한 관리는 구현되지 않았습니다.</div><div class="field full" style="text-align:right"><button class="btn primary">요청 등록</button></div></form>`,true);document.getElementById('requestForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),pick=sel=>[...e.target.querySelectorAll(sel+' .selected')].map(x=>x.textContent),genres=pick('.genre-options');if(!genres.length)return toast('장르를 하나 이상 선택해 주세요.');let groups=[...e.target.querySelectorAll('.field.full .options')];db.requests.push({id:uid(),ownerId:memberId(),title:f.get('title'),author:f.get('author'),genre:genres.join(', '),genres,people:f.get('people'),directions:[...groups[1].querySelectorAll('.selected')].map(x=>x.textContent),feedback:[...groups[2].querySelectorAll('.selected')].map(x=>x.textContent),summary:f.get('summary')});save();closeModal();go('room');toast(storageOK?'합평 요청을 브라우저에 저장했습니다.':'합평 요청을 등록했지만 저장하지 못했습니다. 새로고침하면 사라집니다.')}} 
function joinReview(id){if(!canJoinWorkshop()){toast('작품을 한 편 이상 발표한 회원만 합평에 참여할 수 있습니다.');return}if(!db.reviews.includes(id))db.reviews.push(id);db.notifications.push({text:'합평 참여 신청을 기록했습니다.',date:new Date().toLocaleString('ko-KR')});save();toast('합평 참여 신청을 기록했습니다. 실제 매칭은 연결되지 않았습니다.')}
function toggleFollow(n){db.follows=db.follows.includes(n)?db.follows.filter(x=>x!==n):[...db.follows,n];save();closeModal();toast('작가 팔로우를 업데이트했습니다.')}
function editProfile(){
 let p=myAuthorProfile(),mine=db.works.filter(w=>w.ownerId===memberId());
 modal('작가 프로필 편집',`<div class="field"><label>작가명 또는 필명</label><input class="input" id="profileName" placeholder="작가명" value="${esc(p.name)}"></div>
 <div class="field" style="margin-top:12px"><label>작가 소개</label><textarea class="textarea" id="profileIntro" placeholder="어떤 글을 쓰는 사람인지 소개해 주세요.">${esc(p.intro)}</textarea></div>
 <div class="field" style="margin-top:12px"><label>창작 방향</label><textarea class="textarea" id="profileDirection" placeholder="주로 다루는 주제, 관심 장르, 창작에서 중요하게 생각하는 점 등을 적어 주세요.">${esc(p.direction)}</textarea></div>
 <div class="field" style="margin-top:12px"><label>대표작 지정</label><select class="select" id="featuredWork"><option value="">대표작 선택 안 함</option>${mine.map(w=>`<option value="${esc(w.id)}" ${p.featuredWorkId===w.id?'selected':''}>${esc(w.title)}</option>`).join('')}</select></div>
 <p class="muted small" style="margin-top:12px">작가 프로필은 작품을 발표한 뒤 작가 페이지에 공개됩니다. 대표작은 본인이 발표한 작품 중에서 선택할 수 있습니다.</p>
 <button class="btn primary" onclick="saveMyAuthorProfile({name:document.getElementById('profileName').value.trim(),intro:document.getElementById('profileIntro').value.trim(),direction:document.getElementById('profileDirection').value.trim(),featuredWorkId:document.getElementById('featuredWork').value});appStorage.setItem('jjalsomo_display_name',document.getElementById('profileName').value.trim());closeModal();render();toast('작가 프로필을 저장했습니다.')">저장</button>`,true);
}
function subscribe(){let v=document.getElementById('letterEmail').value;if(!/^[^@]+@[^@]+\.[^@]+$/.test(v))return toast('이메일 주소를 확인해 주세요.');db.newsletter.push(v);save();toast('구독 신청을 브라우저에 기록했습니다.')}
function modal(t,body,wide=false){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" ${wide?'style="width:min(820px,100%)"':''}><div class="modalhead"><h2>${t}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function render(){
 updateBanner();
 const m=document.getElementById('main');
 try{
  const views={home,search:searchPage,library,curation,room,authors,desk,notifications,reader,operator,deletions:deletionAdmin};
  m.innerHTML=(views[page]||home)();
  nav();
 }catch(err){
  console.error('짧글모 화면 렌더링 오류:',err);
  m.innerHTML='<section class="panel" style="margin:40px auto;max-width:760px"><h2>화면을 불러오지 못했습니다.</h2><p class="muted">오류 내용: '+esc(err&&err.message?err.message:String(err))+'</p><button class="btn primary" onclick="resetLocalDataAndReload()">시제품 데이터 초기화 후 다시 열기</button></section>';
 }
}
function resetLocalDataAndReload(){
 if(!confirm('이 브라우저에 저장된 작품·댓글·북마크 등을 모두 지우고 다시 시작할까요?\n\n지우기 전 원본은 백업 항목으로 남기며, 합평실 이용 자격과 회원 ID는 유지됩니다.'))return;
 try{const raw=appStorage.getItem(KEY);if(raw)appStorage.setItem(KEY+'_backup_reset',raw)}catch(e){}
 try{appStorage.setItem(KEY,JSON.stringify({qualifiedAuthors:Array.isArray(db.qualifiedAuthors)?db.qualifiedAuthors:[]}))}catch(e){}
 location.reload();
}

// 모든 동적 버튼은 data-act(+data-a/b/c)로 연결한다. 값을 JS 코드 문자열에 끼워 넣지 않으므로 필명·ID에 어떤 문자가 있어도 안전하다.
const ACTIONS={
 openReader:a=>openReader(a),
 closeOpenReader:a=>{closeModal();openReader(a)},
 softDelete:(a,b,c)=>softDelete(a,b,c||null),
 joinReview:a=>joinReview(a),
 authorDetailById:a=>authorDetailById(a),
 authorDetail:a=>authorDetail(a),
 toggleFollow:a=>toggleFollow(a),
 toggleBookmark:a=>toggleBookmark(a),
 shareWork:a=>shareWork(a),
 addComment:a=>addComment(a),
 genreBrowse:a=>{libGenre=a;libQuery='';go('library')},
 typeBrowse:a=>{libType=a;libGenre='전체';libQuery='';go('library')},
};
document.addEventListener('click',function(event){
 const act=event.target.closest('[data-act]');
 if(act){event.preventDefault();const fn=ACTIONS[act.dataset.act];if(fn)fn(act.dataset.a,act.dataset.b,act.dataset.c);return}
 const control=event.target.closest('[data-go]');
 if(control){event.preventDefault();const d=control.getAttribute('data-go');if(d)go(d)}
});
document.addEventListener('keydown',function(event){
 if(event.key!=='Enter'&&event.key!==' ')return;
 const el=event.target;
 if(el&&el.matches&&el.matches('[role="button"][data-act]')){event.preventDefault();el.click()}
});
document.addEventListener('input',function(event){
 const el=event.target;
 if(el&&el.dataset&&el.dataset.input==='progress'){db.progress[el.dataset.a]=Number(el.value);save();const l=document.getElementById('progressLabel');if(l)l.textContent=el.value+'%'}
});
// 운영자 화면 테스트용 진입로: 주소 끝에 #operator (실제 서비스에서는 인증 + 서버 권한 검증 필요)
window.addEventListener('hashchange',function(){if(location.hash==='#operator'){page='operator';render();window.scrollTo(0,0)}});
window.go=go;
render();
if(bootToasts.length)toast(bootToasts.join(' '));
</script>
</body></html>
